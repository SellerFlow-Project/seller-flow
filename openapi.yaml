openapi: 3.1.0
info:
  title: Seller Flow Account Service
  version: 1.0.0
  description: Account and administration API for the Seller Flow desktop application.
servers:
  - url: /api/v1
security:
  - bearerSession: []
paths:
  /auth/register:
    post:
      security: []
      tags: [Auth]
      summary: Register an ordinary user with a registration code
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        '201':
          description: Registered and logged in
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Session'
        '400':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
  /auth/login:
    post:
      security: []
      tags: [Auth]
      summary: Log in with a login name and password
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Logged in
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Session'
        '401':
          $ref: '#/components/responses/Error'
        '429':
          $ref: '#/components/responses/Error'
  /auth/logout:
    post:
      tags: [Auth]
      summary: Revoke the current session
      responses:
        '204':
          description: Logged out
        '401':
          $ref: '#/components/responses/Error'
  /auth/logout-all:
    post:
      tags: [Auth]
      summary: Revoke every session for the current user
      responses:
        '204':
          description: Logged out everywhere
        '401':
          $ref: '#/components/responses/Error'
  /me:
    get:
      tags: [Account]
      summary: Get the current account
      responses:
        '200':
          description: Current account
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '401':
          $ref: '#/components/responses/Error'
  /me/password:
    put:
      tags: [Account]
      summary: Change the current password and revoke other sessions
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [current_password, new_password]
              properties:
                current_password:
                  type: string
                new_password:
                  type: string
                  minLength: 6
                  maxLength: 128
      responses:
        '204':
          description: Password changed
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
  /admin/registration-codes:
    get:
      tags: [Admin]
      summary: List registration codes
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Offset'
      responses:
        '200':
          description: Registration codes
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/RegistrationCode'
        '403':
          $ref: '#/components/responses/Error'
    post:
      tags: [Admin]
      summary: Create a registration code
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [max_uses]
              properties:
                max_uses:
                  type: integer
                  minimum: 1
                  maximum: 10000
                expires_at:
                  type: [string, 'null']
                  format: date-time
      responses:
        '201':
          description: Plaintext code is returned only once
          content:
            application/json:
              schema:
                type: object
                required: [code, registration_code]
                properties:
                  code:
                    type: string
                  registration_code:
                    $ref: '#/components/schemas/RegistrationCode'
        '403':
          $ref: '#/components/responses/Error'
  /admin/registration-codes/{id}/revoke:
    post:
      tags: [Admin]
      summary: Revoke a registration code
      parameters:
        - $ref: '#/components/parameters/ID'
      responses:
        '204':
          description: Revoked
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
  /admin/users:
    get:
      tags: [Admin]
      summary: List users
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Offset'
      responses:
        '200':
          description: Users
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/User'
        '403':
          $ref: '#/components/responses/Error'
  /admin/users/{id}/status:
    patch:
      tags: [Admin]
      summary: Enable or disable a user
      parameters:
        - $ref: '#/components/parameters/ID'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status:
                  type: string
                  enum: [active, disabled]
      responses:
        '204':
          description: Updated
        '403':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
  /admin/users/{id}/roles:
    put:
      tags: [Admin]
      summary: Replace a user's roles
      parameters:
        - $ref: '#/components/parameters/ID'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [roles]
              properties:
                roles:
                  type: array
                  minItems: 1
                  uniqueItems: true
                  items:
                    type: string
                    enum: [user, staff, admin, super_admin]
      responses:
        '204':
          description: Updated
        '403':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
  /admin/users/{id}/sessions/revoke:
    post:
      tags: [Admin]
      summary: Revoke every session belonging to a user
      parameters:
        - $ref: '#/components/parameters/ID'
      responses:
        '204':
          description: Revoked
        '403':
          $ref: '#/components/responses/Error'
  /admin/audit-logs:
    get:
      tags: [Admin]
      summary: List audit logs
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Offset'
      responses:
        '200':
          description: Audit logs
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/AuditLog'
        '403':
          $ref: '#/components/responses/Error'
components:
  securitySchemes:
    bearerSession:
      type: http
      scheme: bearer
      description: Opaque revocable session token.
  parameters:
    ID:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    Limit:
      name: limit
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 50
    Offset:
      name: offset
      in: query
      schema:
        type: integer
        minimum: 0
        default: 0
  responses:
    Error:
      description: Error response
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
  schemas:
    RegisterRequest:
      type: object
      required: [login_name, password, registration_code]
      properties:
        login_name:
          type: string
          pattern: '^[A-Za-z0-9][A-Za-z0-9._-]{2,63}$'
        password:
          type: string
          minLength: 6
          maxLength: 128
        registration_code:
          type: string
        device_name:
          type: string
          maxLength: 100
    LoginRequest:
      type: object
      required: [login_name, password]
      properties:
        login_name:
          type: string
        password:
          type: string
        device_name:
          type: string
          maxLength: 100
    Session:
      type: object
      required: [token, expires_at, user]
      properties:
        token:
          type: string
        expires_at:
          type: string
          format: date-time
        user:
          $ref: '#/components/schemas/User'
    User:
      type: object
      required: [id, login_name, status, roles, created_at, updated_at]
      properties:
        id:
          type: string
          format: uuid
        login_name:
          type: string
        status:
          type: string
          enum: [active, disabled]
        roles:
          type: array
          items:
            type: string
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    RegistrationCode:
      type: object
      required: [id, hint, status, max_uses, used_count, created_by, created_at]
      properties:
        id:
          type: string
          format: uuid
        hint:
          type: string
        status:
          type: string
          enum: [active, revoked]
        max_uses:
          type: integer
        used_count:
          type: integer
        expires_at:
          type: [string, 'null']
          format: date-time
        created_by:
          type: string
          format: uuid
        created_at:
          type: string
          format: date-time
    AuditLog:
      type: object
      required: [id, action, target_type, target_id, metadata, created_at]
      properties:
        id:
          type: integer
          format: int64
        actor_user_id:
          type: [string, 'null']
          format: uuid
        action:
          type: string
        target_type:
          type: string
        target_id:
          type: string
        metadata:
          type: object
          additionalProperties: true
        created_at:
          type: string
          format: date-time
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message, request_id]
          properties:
            code:
              type: string
            message:
              type: string
            request_id:
              type: string
